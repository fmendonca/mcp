apiVersion: v1
kind: Namespace
metadata:
  name: mcp-server
  labels:
    app.kubernetes.io/name: mcp-openshift
    app.kubernetes.io/part-of: mcp-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-openshift
  namespace: mcp-server
  labels:
    app.kubernetes.io/name: mcp-openshift
    app.kubernetes.io/part-of: mcp-server
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-openshift-auth
  namespace: mcp-server
  labels:
    app.kubernetes.io/name: mcp-openshift
    app.kubernetes.io/part-of: mcp-server
type: Opaque
stringData:
  token: "replace-with-generated-token"
---
# Separate, independently-removable ClusterRole: grants cluster-wide
# get/list on ALL resources in ALL API groups, including Secrets. This is
# required only by the start_must_gather tool, which needs broad discovery
# to collect diagnostics the way `oc adm must-gather` does. Delete this
# ClusterRole and its binding below if that tool is not needed — none of
# the other tools in this server read Secret objects or values.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-openshift-must-gather
  labels:
    app.kubernetes.io/name: mcp-openshift
    app.kubernetes.io/part-of: mcp-server
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list"]
- nonResourceURLs: ["*"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-openshift-must-gather
  labels:
    app.kubernetes.io/name: mcp-openshift
    app.kubernetes.io/part-of: mcp-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-openshift-must-gather
subjects:
- kind: ServiceAccount
  name: mcp-openshift
  namespace: mcp-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-openshift
  labels:
    app.kubernetes.io/name: mcp-openshift
    app.kubernetes.io/part-of: mcp-server
rules:
- apiGroups: [""]
  resources: ["namespaces", "nodes", "persistentvolumes"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "services",
              "persistentvolumeclaims", "configmaps", "serviceaccounts",
              "resourcequotas", "limitranges"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["get", "list", "patch"]
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  verbs: ["create", "delete"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "delete"]
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["create", "patch", "update", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
  verbs: ["get", "list"]
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs: ["get", "list"]
- apiGroups: ["project.openshift.io"]
  resources: ["projects"]
  verbs: ["get", "list"]
- apiGroups: ["project.openshift.io"]
  resources: ["projectrequests"]
  verbs: ["create"]
- apiGroups: ["apps.openshift.io"]
  resources: ["deploymentconfigs"]
  verbs: ["get", "list", "patch", "update"]
- apiGroups: ["build.openshift.io"]
  resources: ["buildconfigs", "builds"]
  verbs: ["get", "list", "create", "patch", "update", "delete"]
- apiGroups: ["build.openshift.io"]
  resources: ["buildconfigs/instantiate"]
  verbs: ["create"]
- apiGroups: ["image.openshift.io"]
  resources: ["imagestreams", "imagestreamtags"]
  verbs: ["get", "list"]
- apiGroups: ["user.openshift.io"]
  resources: ["users", "groups"]
  verbs: ["get", "list"]
- apiGroups: ["security.openshift.io"]
  resources: ["securitycontextconstraints"]
  verbs: ["get", "list"]
- apiGroups: ["config.openshift.io"]
  resources: ["clusterversions", "clusteroperators", "infrastructures"]
  verbs: ["get", "list"]
- apiGroups: ["machineconfiguration.openshift.io"]
  resources: ["machineconfigpools", "machineconfigs"]
  verbs: ["get", "list"]
- apiGroups: ["machine.openshift.io"]
  resources: ["machines", "machinesets"]
  verbs: ["get", "list"]
- apiGroups: ["operators.coreos.com"]
  resources: ["subscriptions", "clusterserviceversions", "catalogsources", "installplans"]
  verbs: ["get", "list"]
- apiGroups: ["operators.coreos.com"]
  resources: ["subscriptions", "operatorgroups"]
  verbs: ["create"]
- apiGroups: ["security.openshift.io"]
  resources: ["securitycontextconstraints"]
  resourceNames: ["privileged"]
  verbs: ["use"]
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachines", "virtualmachineinstances"]
  verbs: ["get", "list"]
- apiGroups: ["subresources.kubevirt.io"]
  resources: ["virtualmachines/start", "virtualmachines/stop", "virtualmachines/restart"]
  verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-openshift
  labels:
    app.kubernetes.io/name: mcp-openshift
    app.kubernetes.io/part-of: mcp-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-openshift
subjects:
- kind: ServiceAccount
  name: mcp-openshift
  namespace: mcp-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-openshift
  namespace: mcp-server
  labels:
    app.kubernetes.io/name: mcp-openshift
    app.kubernetes.io/part-of: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-openshift
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-openshift
        app.kubernetes.io/part-of: mcp-server
    spec:
      serviceAccountName: mcp-openshift
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mcp-openshift
        image: quay.io/fcalomen/mcp:openshift-0.0.22
        imagePullPolicy: Always
        env:
        - name: MCP_ALLOWED_HOSTS
          value: "mcp-openshift-mcp-server.apps.sno.openocp.com,mcp-openshift-mcp-server.apps.sno.openocp.com:*,127.0.0.1:*,localhost:*"
        - name: MCP_ALLOWED_ORIGINS
          value: "https://mcp-openshift-mcp-server.apps.sno.openocp.com,https://mcp-openshift-mcp-server.apps.sno.openocp.com:*,http://127.0.0.1:*,http://localhost:*"
        - name: HELM_RUNNER_IMAGE
          value: "alpine/helm:latest"
        - name: MCP_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: mcp-openshift-auth
              key: token
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-openshift
  namespace: mcp-server
  labels:
    app.kubernetes.io/name: mcp-openshift
    app.kubernetes.io/part-of: mcp-server
spec:
  selector:
    app.kubernetes.io/name: mcp-openshift
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-openshift
  namespace: mcp-server
  labels:
    app.kubernetes.io/name: mcp-openshift
    app.kubernetes.io/part-of: mcp-server
spec:
  to:
    kind: Service
    name: mcp-openshift
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

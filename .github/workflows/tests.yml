name: Tests and Linting

on:
  push:
    branches: [main, develop, 'feat/**']
    paths:
      - 'mcp-openshift/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mcp-openshift/**'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: mcp-openshift
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        working-directory: mcp-openshift
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./mcp-openshift/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: mcp-openshift
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Bandit security scan
        working-directory: mcp-openshift
        continue-on-error: true
        run: bandit -r . -ll -x tests/ -f json -o bandit-report.json || true

      - name: pip-audit vulnerability scan
        working-directory: mcp-openshift
        continue-on-error: true
        run: pip-audit --skip-editable --desc || true

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: mcp-openshift
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Format check with black
        working-directory: mcp-openshift
        run: black --check --diff *.py tests/

      - name: Sort imports with isort
        working-directory: mcp-openshift
        run: isort --check-only --diff *.py tests/

      - name: Lint with flake8
        working-directory: mcp-openshift
        continue-on-error: true
        run: |
          flake8 *.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 *.py --count --exit-zero --max-complexity=10 --max-line-length=120

      - name: Type check with mypy
        working-directory: mcp-openshift
        continue-on-error: true
        run: mypy *.py --ignore-missing-imports --no-strict-optional || true

  helm-lint:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Lint Helm chart
        working-directory: mcp-openshift
        run: helm lint charts/mcp-openshift/ --strict

      - name: Template validation
        working-directory: mcp-openshift
        run: |
          helm template mcp-openshift charts/mcp-openshift/ \
            --values charts/mcp-openshift/values.yaml \
            --set auth.token=ci-test-token-placeholder \
            --output-dir /tmp/helm-templates

  dockerfile-lint:
    name: Dockerfile Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Hadolint Dockerfile scan
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: mcp-openshift/Dockerfile
          ignore: DL3008,DL3009
        continue-on-error: true

{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- if not .Values.auth.token }}
{{- fail "auth.token is required when auth.enabled=true and auth.existingSecret is not set" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-openshift.authSecretName" . }}
  namespace: {{ include "mcp-openshift.namespace" . }}
  labels:
    {{- include "mcp-openshift.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.tokenKey }}: {{ .Values.auth.token | quote }}
{{- end }}

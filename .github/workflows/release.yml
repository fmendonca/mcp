name: Release — Build UBI9 image & publish to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'mcp-openshift/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override version (e.g. 0.0.5) — skips auto-increment'
        required: false
        type: string

permissions:
  contents: write   # create tags and GitHub releases
  packages: write   # push to GHCR

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. Calculate next semantic version
  # ──────────────────────────────────────────────────────────
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calc.outputs.tag }}
      version: ${{ steps.calc.outputs.version }}
      changelog: ${{ steps.changelog.outputs.text }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: calc
        run: |
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            TAG="v${{ github.event.inputs.version_override }}"
          else
            # Get latest semver tag; default to v0.0.2 so first release = v0.0.3
            LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | tail -1)
            LATEST="${LATEST:-v0.0.2}"
            MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=${TAG}"           >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"     >> "$GITHUB_OUTPUT"

      - name: Build changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            LOG=$(git log --oneline "${PREV}..HEAD" \
              --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))")
          else
            LOG=$(git log --oneline -20 \
              --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))")
          fi
          # Write to file to handle newlines
          echo "$LOG" > /tmp/changelog.txt
          {
            echo "text<<EOF"
            cat /tmp/changelog.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────
  # 2. Build multi-arch UBI9 image and push to GHCR
  # ──────────────────────────────────────────────────────────
  build-push:
    name: Build & push UBI9 image
    runs-on: ubuntu-latest
    needs: version
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mcp-openshift
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=mcp-openshift
            org.opencontainers.image.description=OpenShift Admin MCP Server (UBI9)
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push (linux/amd64 + linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: mcp-openshift
          file: mcp-openshift/Dockerfile.ubi9
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          # Attach a signed SLSA provenance attestation and an SPDX SBOM to
          # the pushed image so consumers can verify what was built, from
          # what source, and with which dependencies.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────
  # 3. Package and publish the Helm chart as an OCI artifact
  # ──────────────────────────────────────────────────────────
  publish-chart:
    name: Publish Helm chart to GHCR
    runs-on: ubuntu-latest
    needs: [version, build-push]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin

      - name: Package chart
        working-directory: mcp-openshift
        run: |
          helm package charts/mcp-openshift \
            --version "${{ needs.version.outputs.version }}" \
            --app-version "${{ needs.version.outputs.version }}" \
            --destination /tmp/chart-out

      - name: Push chart to ghcr.io/${{ github.repository_owner }}/charts
        run: |
          helm push /tmp/chart-out/mcp-openshift-${{ needs.version.outputs.version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts

  # ──────────────────────────────────────────────────────────
  # 4. Tag the commit and create GitHub Release
  # ──────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build-push, publish-chart]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Tags pushed with the default GITHUB_TOKEN do NOT trigger other
          # workflows (GitHub's anti-recursion safeguard) — build-and-push.yml
          # listens for `push: tags: v*` and silently never fires unless this
          # checkout authenticates with a PAT instead. Falls back to
          # GITHUB_TOKEN (today's behavior) if RELEASE_PAT isn't configured.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Create and push git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.version.outputs.tag }}" \
            -m "Release ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "mcp-openshift ${{ needs.version.outputs.tag }}"
          body: |
            ## mcp-openshift ${{ needs.version.outputs.tag }}

            > Built from commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) on `main`.

            ### Container image

            ```bash
            # Pull latest
            podman pull ghcr.io/${{ github.repository_owner }}/mcp-openshift:latest

            # Pull specific version
            podman pull ghcr.io/${{ github.repository_owner }}/mcp-openshift:${{ needs.version.outputs.tag }}
            ```

            **Image digest:** `${{ needs.build-push.outputs.digest }}`
            **Platforms:** `linux/amd64`, `linux/arm64`
            **Base image:** `registry.access.redhat.com/ubi9/python-312`

            ### Helm chart

            ```bash
            helm install mcp-openshift \
              oci://ghcr.io/${{ github.repository_owner }}/charts/mcp-openshift \
              --version ${{ needs.version.outputs.version }} \
              --namespace mcp-server --create-namespace \
              --set auth.token="$(openssl rand -hex 32)"
            ```

            ### Quick start

            ```bash
            export MCP_AUTH_TOKEN="$(openssl rand -hex 32)"

            podman run -d \
              -e MCP_AUTH_TOKEN="$MCP_AUTH_TOKEN" \
              -e KUBECONFIG=/kube/config \
              -v ~/.kube:/kube:ro \
              -p 8000:8000 \
              ghcr.io/${{ github.repository_owner }}/mcp-openshift:${{ needs.version.outputs.tag }}
            ```

            ### Changes in this release

            ${{ needs.version.outputs.changelog }}

            ---
            *See [RELEASE.md](https://github.com/${{ github.repository }}/blob/main/RELEASE.md) for the full release process.*
          draft: false
          prerelease: false

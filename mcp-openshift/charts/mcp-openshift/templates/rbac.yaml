{{- if and .Values.rbac.create .Values.rbac.mustGatherDiscovery }}
# Separate, independently-toggleable ClusterRole: grants cluster-wide
# get/list on ALL resources in ALL API groups, including Secrets. This is
# required only by the start_must_gather tool, which needs broad discovery
# to collect diagnostics the way `oc adm must-gather` does. Disable via
# `rbac.mustGatherDiscovery: false` if that tool is not needed — none of the
# other tools in this server read Secret objects or values.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mcp-openshift.fullname" . }}-must-gather
  labels:
    {{- include "mcp-openshift.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mcp-openshift.fullname" . }}-must-gather
  labels:
    {{- include "mcp-openshift.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mcp-openshift.fullname" . }}-must-gather
subjects:
  - kind: ServiceAccount
    name: {{ include "mcp-openshift.serviceAccountName" . }}
    namespace: {{ include "mcp-openshift.namespace" . }}
{{- end }}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mcp-openshift.fullname" . }}
  labels:
    {{- include "mcp-openshift.labels" . | nindent 4 }}
rules:
  # Core: namespaces, nodes, pods, services, events, storage, config, quotas
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "persistentvolumes", "storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services",
                "persistentvolumeclaims", "configmaps", "serviceaccounts",
                "resourcequotas", "limitranges"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Apps
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["create", "delete"]
  # Storage
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list"]
  # Autoscaling
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  # Batch
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete"]
  # RBAC
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list"]
  # OpenShift Routes
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
  # OpenShift Projects
  - apiGroups: ["project.openshift.io"]
    resources: ["projects"]
    verbs: ["get", "list"]
  - apiGroups: ["project.openshift.io"]
    resources: ["projectrequests"]
    verbs: ["create"]
  # OpenShift Apps (DeploymentConfigs)
  - apiGroups: ["apps.openshift.io"]
    resources: ["deploymentconfigs"]
    verbs: ["get", "list", "patch", "update"]
  # OpenShift Build
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs", "builds"]
    verbs: ["get", "list"]
  # OpenShift Image
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags"]
    verbs: ["get", "list"]
  # OpenShift User / Group
  - apiGroups: ["user.openshift.io"]
    resources: ["users", "groups"]
    verbs: ["get", "list"]
  # OpenShift Security
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    verbs: ["get", "list"]
  # OpenShift Config
  - apiGroups: ["config.openshift.io"]
    resources: ["clusterversions", "clusteroperators", "infrastructures"]
    verbs: ["get", "list"]
  # Machine Config
  - apiGroups: ["machineconfiguration.openshift.io"]
    resources: ["machineconfigpools", "machineconfigs"]
    verbs: ["get", "list"]
  # Machine API
  - apiGroups: ["machine.openshift.io"]
    resources: ["machines", "machinesets"]
    verbs: ["get", "list"]
  # OLM
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions", "clusterserviceversions", "catalogsources", "installplans"]
    verbs: ["get", "list"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions", "operatorgroups"]
    verbs: ["create"]
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["privileged"]
    verbs: ["use"]
  # KubeVirt VMs and VMIs (read)
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list"]
  # KubeVirt VM power actions (start/stop/restart via subresource)
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachines/start", "virtualmachines/stop", "virtualmachines/restart"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mcp-openshift.fullname" . }}
  labels:
    {{- include "mcp-openshift.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mcp-openshift.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mcp-openshift.serviceAccountName" . }}
    namespace: {{ include "mcp-openshift.namespace" . }}
{{- end }}

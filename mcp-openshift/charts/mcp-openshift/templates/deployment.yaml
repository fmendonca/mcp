apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-openshift.fullname" . }}
  namespace: {{ include "mcp-openshift.namespace" . }}
  labels:
    {{- include "mcp-openshift.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-openshift.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-openshift.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: mcp-server
    spec:
      serviceAccountName: {{ include "mcp-openshift.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "mcp-openshift.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MCP_ALLOWED_HOSTS
              value: {{ join "," .Values.mcp.allowedHosts | quote }}
            - name: MCP_ALLOWED_ORIGINS
              value: {{ join "," .Values.mcp.allowedOrigins | quote }}
            - name: HELM_RUNNER_IMAGE
              value: {{ .Values.mcp.helmRunnerImage | quote }}
            {{- if .Values.auth.enabled }}
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-openshift.authSecretName" . }}
                  key: {{ .Values.auth.tokenKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
